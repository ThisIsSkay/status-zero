<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="color-scheme" content="dark">
<meta name="description" content="Live status for ChatGPT and Claude.">
<meta property="og:title" content="Status Zero — AI Service Monitor">
<meta property="og:description" content="Live status for ChatGPT and Claude.">
<meta property="og:type" content="website">
<meta property="og:url" content="https://thisisskay.github.io/status-zero/">
<meta property="og:image" content="https://thisisskay.github.io/status-zero/public/status-zero-og.png">
<meta property="og:image:width" content="1200">
<meta property="og:image:height" content="630">
<meta property="og:image:alt" content="Status Zero ASCII terminal service monitor">
<meta name="twitter:card" content="summary_large_image">
<meta name="twitter:title" content="Status Zero — AI Service Monitor">
<meta name="twitter:description" content="Live status for ChatGPT and Claude.">
<meta name="twitter:image" content="https://thisisskay.github.io/status-zero/public/status-zero-og.png">
<title>Status Zero — AI Service Monitor</title>
<style>
:root{--bg:#0a0b0d;--surface:#141619;--surface-2:#1b1e22;--border:#2a2e33;--text:#eef1f3;--muted:#8b9199;--green:#3ddc84;--green-dim:#28c76f;--orange:#ffb020;--red:#ff5c5c;--shadow:rgba(0,0,0,.4)}
*{box-sizing:border-box}
html,body{margin:0;min-height:100%}
body{background:var(--bg);color:var(--text);font-family:ui-monospace,"SF Mono",Consolas,"Cascadia Code","Courier New",monospace;-webkit-font-smoothing:antialiased;line-height:1.45}
button,a{font:inherit}
.wrap{margin:0 auto;max-width:760px;padding:20px 16px 40px}

.site-header{align-items:center;display:flex;gap:10px;justify-content:space-between;padding:6px 2px 22px}
.brand{align-items:center;display:flex;gap:10px;font-size:16px;font-weight:700}
.brand-mark{background:var(--green);border-radius:6px;color:#06210f;display:inline-flex;font-weight:900;height:26px;justify-content:center;align-items:center;width:26px}
.live{align-items:center;color:var(--muted);display:flex;font-size:12px;gap:7px}
.live-dot{background:var(--green);border-radius:50%;box-shadow:0 0 8px rgba(61,220,132,.6);height:7px;width:7px}

.banner{align-items:center;background:var(--surface);border:1px solid var(--border);border-radius:14px;display:flex;gap:14px;padding:16px;box-shadow:0 10px 30px var(--shadow)}
.banner-icon{align-items:center;background:var(--surface-2);border-radius:50%;display:flex;flex:none;font-size:20px;height:44px;justify-content:center;width:44px}
.banner-icon.ok{color:var(--green)}
.banner-icon.warn{color:var(--orange)}
.banner-icon.bad{color:var(--red)}
.banner-text{flex:1;min-width:0}
.banner-label{color:var(--muted);font-size:11px;letter-spacing:.08em;text-transform:uppercase}
.banner-value{font-size:17px;font-weight:700;margin-top:2px}
.banner-value.ok{color:var(--green)}
.banner-value.warn{color:var(--orange)}
.banner-value.bad{color:var(--red)}
.refresh-btn{align-items:center;background:var(--surface-2);border:1px solid var(--border);border-radius:10px;color:var(--text);cursor:pointer;display:flex;flex:none;gap:8px;font-size:13px;font-weight:600;height:40px;padding:0 14px}
.refresh-btn:hover{border-color:#3a4046}
.refresh-btn:disabled{cursor:wait;opacity:.6}
.spin{animation:spin .75s linear infinite;display:inline-block}

.cards{display:grid;gap:14px;grid-template-columns:1fr;margin-top:16px}

.card{background:var(--surface);border:1px solid var(--border);border-radius:14px;overflow:hidden}
.card-head{align-items:center;display:flex;gap:12px;justify-content:space-between;padding:16px 16px 14px}
.card-title{align-items:center;display:flex;gap:12px;min-width:0}
.card-icon{align-items:center;background:var(--surface-2);border-radius:10px;display:flex;flex:none;font-size:16px;font-weight:700;height:36px;justify-content:center;width:36px}
.card-eyebrow{color:var(--muted);font-size:10px;letter-spacing:.1em;text-transform:uppercase}
.card-title h2{font-size:16px;margin:2px 0 0}
.badge{align-items:center;background:var(--surface-2);border-radius:999px;display:flex;flex:none;font-size:11px;font-weight:700;gap:6px;padding:6px 10px;text-transform:uppercase;white-space:nowrap}
.badge i{background:var(--green);border-radius:50%;height:6px;width:6px}
.card.warning .badge{color:var(--orange)}
.card.warning .badge i{background:var(--orange)}
.card.danger .badge,.card.unknown .badge{color:var(--red)}
.card.danger .badge i,.card.unknown .badge i{background:var(--red)}
.card.healthy .badge{color:var(--green)}

.components{border-top:1px solid var(--border);margin:0;padding:0}
.component{align-items:center;border-bottom:1px solid var(--border);display:flex;font-size:13px;gap:10px;justify-content:space-between;padding:10px 16px}
.component:last-child{border-bottom:0}
.component-name{color:#cfd3d7;flex:1;min-width:0}
.component-state{align-items:center;color:var(--green);display:flex;flex:none;font-size:11px;gap:6px;white-space:nowrap}
.component-state i{background:currentColor;border-radius:50%;height:6px;width:6px}
.component-state:not(.operational){color:var(--orange)}

.card-foot{align-items:center;background:var(--surface-2);display:flex;font-size:11px;gap:8px;justify-content:space-between;padding:11px 16px}
.card-foot span{color:var(--muted)}
.card-foot a{color:#8fcf9f;text-decoration:none}
.card-foot a:hover{text-decoration:underline}

.site-footer{color:var(--muted);font-size:11px;margin-top:22px;padding:0 2px;text-align:center}

@keyframes spin{to{transform:rotate(360deg)}}

@media(min-width:640px){
  .cards{grid-template-columns:repeat(2,1fr)}
}
@media(max-width:400px){
  .wrap{padding:14px 12px 32px}
  .banner{flex-wrap:wrap}
  .refresh-btn{flex:1 1 100%;justify-content:center}
}
</style>
</head>
<body>
<div class="wrap">
  <header class="site-header">
    <div class="brand"><span class="brand-mark">Z</span>Status Zero</div>
    <div class="live"><span class="live-dot"></span>Official feeds</div>
  </header>

  <section class="banner" aria-label="Overall status">
    <span class="banner-icon" id="overallIcon">◐</span>
    <div class="banner-text">
      <div class="banner-label">Overall status</div>
      <div class="banner-value" id="overall">Checking…</div>
    </div>
    <button class="refresh-btn" id="refresh"><span id="refreshIcon">↻</span><span id="refreshText">Refresh</span></button>
  </section>

  <section class="cards" id="cards" aria-label="AI service status"></section>

  <footer class="site-footer">
    Auto-refreshes every 60s · next check in <span id="nextCheck">60s</span> · last checked <span id="lastCheck">—</span>
  </footer>
</div>
<script>
const SOURCES=[
 {id:'openai',name:'ChatGPT',vendor:'OpenAI',url:'https://status.openai.com/api/v2/summary.json',page:'https://status.openai.com/',components:['Conversations','Login','Search','GPTs']},
 {id:'claude',name:'Claude',vendor:'Anthropic',url:'https://status.claude.com/api/v2/summary.json',page:'https://status.claude.com/',components:['claude.ai','Claude API (api.anthropic.com)','Claude Code']}
];
let seconds=60;
const stateClass=indicator=>indicator==='none'?'healthy':['minor','maintenance'].includes(indicator)?'warning':['major','critical'].includes(indicator)?'danger':'unknown';
const stateLabel=indicator=>indicator==='none'?'Operational':['minor','maintenance'].includes(indicator)?'Degraded':['major','critical'].includes(indicator)?'Outage':'Unavailable';
const pretty=status=>status==='operational'?'Operational':status.replaceAll('_',' ').replace(/\b\w/g,l=>l.toUpperCase());
const formatTime=date=>new Intl.DateTimeFormat(undefined,{hour:'2-digit',minute:'2-digit'}).format(date);
function renderCards(providers){
 document.getElementById('cards').innerHTML=providers.map(provider=>{
  const type=stateClass(provider.indicator);
  const components=provider.components.length?provider.components.map(component=>`<div class="component"><span class="component-name">${component.name}</span><span class="component-state ${component.status}"><i></i>${pretty(component.status)}</span></div>`).join(''):'<div class="component"><span class="component-name">Official endpoint</span><span class="component-state"><i></i>No response</span></div>';
  return `<article class="card ${type}"><header class="card-head"><div class="card-title"><span class="card-icon">${provider.id==='openai'?'O':'A'}</span><div><div class="card-eyebrow">${provider.vendor}</div><h2>${provider.name}</h2></div></div><span class="badge"><i></i>${stateLabel(provider.indicator)}</span></header><div class="components">${components}</div><footer class="card-foot"><span>Updated ${provider.updatedAt?formatTime(new Date(provider.updatedAt)):'unknown'}</span><a href="${provider.page}" target="_blank" rel="noreferrer">Status page ↗</a></footer></article>`;
 }).join('');
}
async function check(){
 const button=document.getElementById('refresh'),icon=document.getElementById('refreshIcon'),label=document.getElementById('refreshText');
 button.disabled=true;icon.className='spin';label.textContent='Checking…';
 const providers=await Promise.all(SOURCES.map(async source=>{try{const response=await fetch(source.url,{cache:'no-store'});if(!response.ok)throw new Error('HTTP '+response.status);const data=await response.json();return{...source,indicator:data.status?.indicator||'unknown',updatedAt:data.page?.updated_at||null,components:source.components.map(name=>(data.components||[]).find(component=>component.name===name)).filter(Boolean)}}catch{return{...source,indicator:'unknown',updatedAt:null,components:[]}}}));
 const classes=providers.map(provider=>stateClass(provider.indicator));
 const overallEl=document.getElementById('overall'),iconEl=document.getElementById('overallIcon');
 if(classes.includes('danger')||classes.includes('unknown')){overallEl.textContent='Attention needed';overallEl.className='banner-value bad';iconEl.textContent='⚠';iconEl.className='banner-icon bad';}
 else if(classes.includes('warning')){overallEl.textContent='Degraded performance';overallEl.className='banner-value warn';iconEl.textContent='◐';iconEl.className='banner-icon warn';}
 else{overallEl.textContent='All systems operational';overallEl.className='banner-value ok';iconEl.textContent='●';iconEl.className='banner-icon ok';}
 document.getElementById('lastCheck').textContent=formatTime(new Date());
 seconds=60;
 renderCards(providers);
 button.disabled=false;icon.className='';label.textContent='Refresh';
}
function tick(){seconds=seconds<=1?60:seconds-1;document.getElementById('nextCheck').textContent=`${seconds}s`}
document.getElementById('refresh').addEventListener('click',check);
setInterval(tick,1000);setInterval(check,60000);tick();check();
</script>
</body>
</html>
