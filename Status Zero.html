<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="color-scheme" content="dark">
<meta name="description" content="Live status for ChatGPT, Claude, and Copilot.">
<meta property="og:title" content="Status Zero — AI Service Monitor">
<meta property="og:description" content="Live status for ChatGPT, Claude, and Copilot.">
<meta property="og:type" content="website">
<meta property="og:url" content="https://thisisskay.github.io/status-zero/">
<meta property="og:image" content="https://thisisskay.github.io/status-zero/public/status-zero-og.png">
<meta property="og:image:width" content="1200">
<meta property="og:image:height" content="630">
<meta property="og:image:alt" content="Status Zero ASCII terminal service monitor">
<meta name="twitter:card" content="summary_large_image">
<meta name="twitter:title" content="Status Zero — AI Service Monitor">
<meta name="twitter:description" content="Live status for ChatGPT, Claude, and Copilot.">
<meta name="twitter:image" content="https://thisisskay.github.io/status-zero/public/status-zero-og.png">
<title>Status Zero — AI Service Monitor</title>
<link rel="icon" id="favicon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Ccircle cx='16' cy='16' r='11' fill='%238b9199'/%3E%3C/svg%3E">
<style>
:root{--bg:#0a0b0d;--surface:#141619;--surface-2:#1b1e22;--border:#2a2e33;--text:#eef1f3;--muted:#8b9199;--green:#3ddc84;--green-dim:#28c76f;--orange:#ffb020;--red:#ff5c5c;--shadow:rgba(0,0,0,.4)}
*{box-sizing:border-box}
html,body{margin:0;min-height:100%}
body{background:var(--bg);color:var(--text);font-family:ui-monospace,"SF Mono",Consolas,"Cascadia Code","Courier New",monospace;-webkit-font-smoothing:antialiased;line-height:1.45}
button,a{font:inherit}
.wrap{margin:0 auto;max-width:760px;padding:20px 16px 40px}

.site-header{align-items:center;display:flex;gap:10px;justify-content:space-between;padding:6px 2px 22px}
.brand{align-items:center;display:flex;gap:10px;font-size:16px;font-weight:700}
.brand-mark{background:var(--green);border-radius:6px;color:#06210f;display:inline-flex;font-weight:900;height:26px;justify-content:center;align-items:center;width:26px}
.live{align-items:center;color:var(--muted);display:flex;font-size:12px;gap:7px}
.live-dot{background:var(--green);border-radius:50%;box-shadow:0 0 8px rgba(61,220,132,.6);height:7px;width:7px}

.banner{align-items:center;background:var(--surface);border:1px solid var(--border);border-radius:14px;display:flex;gap:14px;padding:16px;box-shadow:0 10px 30px var(--shadow)}
.banner-icon{align-items:center;background:var(--surface-2);border-radius:50%;display:flex;flex:none;font-size:20px;height:44px;justify-content:center;width:44px}
.banner-icon.ok{color:var(--green)}
.banner-icon.warn{color:var(--orange)}
.banner-icon.bad{color:var(--red)}
.banner-text{flex:1;min-width:0}
.banner-label{color:var(--muted);font-size:11px;letter-spacing:.08em;text-transform:uppercase}
.banner-value{font-size:17px;font-weight:700;margin-top:2px}
.banner-value.ok{color:var(--green)}
.banner-value.warn{color:var(--orange)}
.banner-value.bad{color:var(--red)}
.banner-note{color:var(--muted);font-size:11px;margin-top:3px}
.refresh-btn{align-items:center;background:var(--surface-2);border:1px solid var(--border);border-radius:10px;color:var(--text);cursor:pointer;display:flex;flex:none;gap:8px;font-size:13px;font-weight:600;height:40px;padding:0 14px}
.refresh-btn:hover{border-color:#3a4046}
.refresh-btn:disabled{cursor:wait;opacity:.6}
.spin{animation:spin .75s linear infinite;display:inline-block}

/* Active incidents / maintenance. Renders nothing when everything is green. */
.alerts{display:grid;gap:8px;margin-top:14px}
.alerts:empty{display:none}
.alert{align-items:flex-start;background:var(--surface);border:1px solid var(--border);border-left:3px solid var(--orange);border-radius:10px;display:flex;gap:12px;justify-content:space-between;padding:12px 14px}
.alert.maintenance{border-left-color:var(--muted)}
.alert.critical{border-left-color:var(--red)}
.alert-body{flex:1;min-width:0}
.alert-meta{color:var(--muted);font-size:10px;letter-spacing:.06em;text-transform:uppercase}
.alert-name{font-size:13px;margin-top:3px}
.alert-link{color:#8fcf9f;flex:none;font-size:11px;text-decoration:none;white-space:nowrap}
.alert-link:hover{text-decoration:underline}

/* align-items:start keeps each card at its natural height; stretching them to
   the tallest in the row leaves big empty voids under the shorter ones. */
.cards{align-items:start;display:grid;gap:14px;grid-template-columns:1fr;margin-top:16px}

.card{background:var(--surface);border:1px solid var(--border);border-radius:14px;overflow:hidden}
.card-head{align-items:center;display:flex;flex-wrap:wrap;gap:12px;justify-content:space-between;padding:16px 16px 14px}
.card-title{align-items:center;display:flex;gap:12px;min-width:0}
/* Let the badge drop to its own line when a long name would otherwise push it
   off the card, rather than the two overlapping. */
.card-heading{min-width:0}
.card-heading h2{overflow-wrap:anywhere}
.card-icon{align-items:center;background:var(--surface-2);border-radius:10px;display:flex;flex:none;font-size:16px;font-weight:700;height:36px;justify-content:center;width:36px}
.card-eyebrow{color:var(--muted);font-size:10px;letter-spacing:.1em;text-transform:uppercase}
.card-title h2{font-size:16px;margin:2px 0 0}
.badge{align-items:center;background:var(--surface-2);border-radius:999px;display:flex;flex:none;font-size:11px;font-weight:700;gap:6px;padding:6px 10px;text-transform:uppercase;white-space:nowrap}
.badge i{background:var(--green);border-radius:50%;height:6px;width:6px}
.card.warning .badge{color:var(--orange)}
.card.warning .badge i{background:var(--orange)}
.card.danger .badge{color:var(--red)}
.card.danger .badge i{background:var(--red)}
.card.healthy .badge{color:var(--green)}
/* Providers with nothing readable collapse to a compact link, grouped together
   at the end rather than left as empty holes in the card grid. */
.tiles-label{color:var(--muted);font-size:11px;letter-spacing:.08em;margin:22px 2px 0;text-transform:uppercase}
.tiles{display:grid;gap:10px;grid-template-columns:repeat(auto-fill,minmax(190px,1fr));margin-top:10px}
.tile{align-items:center;background:var(--surface);border:1px solid var(--border);border-radius:12px;color:inherit;display:flex;gap:10px;padding:11px 12px;text-decoration:none}
.tile:hover{background:var(--surface-2);border-color:#3a3f45}
.tile .card-icon{flex:none;font-size:13px;height:30px;width:30px}
.tile-body{display:block;min-width:0}
.tile-name{display:block;font-size:13px;font-weight:700;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.tile-reason{color:var(--muted);display:block;font-size:10px;letter-spacing:.05em;margin-top:2px;text-transform:uppercase}
.tile-cta{color:#8fcf9f;flex:none;font-size:12px;margin-left:auto}

.components{border-top:1px solid var(--border);margin:0;padding:0}
.component{align-items:center;border-bottom:1px solid var(--border);display:flex;font-size:13px;gap:10px;justify-content:space-between;padding:10px 16px}
.component:last-child{border-bottom:0}
.component-name{color:#cfd3d7;flex:1;min-width:0}
.component-state{align-items:center;color:var(--green);display:flex;flex:none;font-size:11px;gap:6px;white-space:nowrap}
.component-state i{background:currentColor;border-radius:50%;height:6px;width:6px}
.component-state:not(.operational){color:var(--orange)}
.component-state.unavailable{color:var(--muted)}

.card-foot{align-items:center;background:var(--surface-2);display:flex;font-size:11px;gap:8px;justify-content:space-between;padding:11px 16px}
.card-foot span{color:var(--muted)}
.card-foot a{color:#8fcf9f;text-decoration:none}
.card-foot a:hover{text-decoration:underline}

.site-footer{color:var(--muted);font-size:11px;margin-top:22px;padding:0 2px;text-align:center}

@keyframes spin{to{transform:rotate(360deg)}}

@media(min-width:640px){
  .cards{grid-template-columns:repeat(2,1fr)}
}
@media(min-width:1180px){
  /* Widen the shell alongside the third column so each card keeps roughly the
     same width it has at two columns, instead of being squeezed to ~230px. */
  .wrap{max-width:1140px}
  .cards{grid-template-columns:repeat(3,1fr)}
}
@media(max-width:400px){
  .wrap{padding:14px 12px 32px}
  .banner{flex-wrap:wrap}
  .refresh-btn{flex:1 1 100%;justify-content:center}
}
</style>
</head>
<body>
<div class="wrap">
  <header class="site-header">
    <div class="brand"><span class="brand-mark">Z</span>Status Zero</div>
    <div class="live"><span class="live-dot"></span>Official feeds</div>
  </header>

  <section class="banner" aria-label="Overall status">
    <span class="banner-icon" id="overallIcon">◐</span>
    <div class="banner-text">
      <div class="banner-label">Overall status</div>
      <div class="banner-value" id="overall">Checking…</div>
      <div class="banner-note" id="overallNote"></div>
    </div>
    <button class="refresh-btn" id="refresh"><span id="refreshIcon">↻</span><span id="refreshText">Refresh</span></button>
  </section>

  <section class="alerts" id="alerts" aria-label="Active incidents" aria-live="polite"></section>

  <section class="cards" id="cards" aria-label="AI service status"></section>

  <h2 class="tiles-label" id="tilesLabel" hidden>Direct links</h2>
  <section class="tiles" id="tiles" aria-label="Services without a readable feed"></section>

  <footer class="site-footer">
    Auto-refreshes every 60s · next check in <span id="nextCheck">60s</span> · last checked <span id="lastCheck">—</span>
  </footer>
</div>
<script>
// Every provider here must serve its status JSON cross-origin (CORS), since
// this page is static and fetches straight from the browser.
// Deliberately absent: xAI (Grok) and Mistral AI (Le Chat). Both run on
// Instatus, which does not serve status JSON cross-origin, so neither can be
// read from a static page — see README.
const SOURCES=[
 {id:'openai',icon:'O',name:'ChatGPT',vendor:'OpenAI',url:'https://status.openai.com/api/v2/summary.json',page:'https://status.openai.com/',components:['Conversations','Login','Search','GPTs']},
 {id:'claude',icon:'A',name:'Claude',vendor:'Anthropic',url:'https://status.claude.com/api/v2/summary.json',page:'https://status.claude.com/',components:['claude.ai','Claude API (api.anthropic.com)','Claude Code']},
 {id:'mscopilot',icon:'Co',name:'Copilot',vendor:'Microsoft',url:'https://copilot.statuspage.io/api/v2/summary.json',page:'https://copilot.statuspage.io/',components:null},
 {id:'ghcopilot',icon:'Gh',name:'GitHub Copilot',vendor:'GitHub',url:'https://www.githubstatus.com/api/v2/summary.json',page:'https://www.githubstatus.com/',components:['Copilot']},
 {id:'grok',icon:'Gk',name:'Grok',vendor:'xAI',url:'https://status.x.ai/api/v2/summary.json',page:'https://status.x.ai/',components:null},
 // Google publishes no Statuspage feed — its status lives at status.cloud.google.com
 // in an unrelated format — so Gemini is a deliberate link, not a failed fetch.
 {id:'gemini',icon:'Ge',name:'Gemini',vendor:'Google',page:'https://status.cloud.google.com/',linkOnly:true,note:'No public feed'},
 {id:'perplexity',icon:'P',name:'Perplexity',vendor:'Perplexity',url:'https://status.perplexity.com/api/v2/summary.json',page:'https://status.perplexity.com/',components:null},
 {id:'cursor',icon:'Cu',name:'Cursor',vendor:'Anysphere',url:'https://status.cursor.com/api/v2/summary.json',page:'https://status.cursor.com/',components:null},
 {id:'mistral',icon:'M',name:'Mistral',vendor:'Mistral AI',url:'https://status.mistral.ai/api/v2/summary.json',page:'https://status.mistral.ai/',components:null},
 {id:'huggingface',icon:'Hf',name:'Hugging Face',vendor:'Hugging Face',url:'https://status.huggingface.co/api/v2/summary.json',page:'https://status.huggingface.co/',components:null},
 {id:'groq',icon:'Gq',name:'Groq',vendor:'Groq',url:'https://groqstatus.com/api/v2/summary.json',page:'https://groqstatus.com/',components:null},
 {id:'replicate',icon:'R',name:'Replicate',vendor:'Replicate',url:'https://replicatestatus.com/api/v2/summary.json',page:'https://replicatestatus.com/',components:null},
 {id:'elevenlabs',icon:'El',name:'ElevenLabs',vendor:'ElevenLabs',url:'https://status.elevenlabs.io/api/v2/summary.json',page:'https://status.elevenlabs.io/',components:null},
 {id:'cohere',icon:'Ch',name:'Cohere',vendor:'Cohere',url:'https://status.cohere.com/api/v2/summary.json',page:'https://status.cohere.com/',components:null}
];
let seconds=60;
const stateClass=indicator=>indicator==='none'?'healthy':['minor','maintenance'].includes(indicator)?'warning':['major','critical'].includes(indicator)?'danger':'unknown';
const stateLabel=indicator=>indicator==='none'?'Operational':['minor','maintenance'].includes(indicator)?'Degraded':['major','critical'].includes(indicator)?'Outage':'Unavailable';
const pretty=status=>status==='operational'?'Operational':status.replaceAll('_',' ').replace(/\b\w/g,l=>l.toUpperCase());
const formatTime=date=>new Intl.DateTimeFormat(undefined,{hour:'2-digit',minute:'2-digit'}).format(date);
const escapeHtml=value=>String(value).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const titleCase=value=>String(value).replaceAll('_',' ').replace(/\b\w/g,l=>l.toUpperCase());
// Atlassian Statuspage.io shape: {status:{indicator}, page:{updated_at}, components:[{name,status}],
// incidents:[{name,status,impact,shortlink}], scheduled_maintenances:[{name,status,shortlink}]}
function parseStatuspage(source,data){
 // Anything not operational sorts first so a card shows the broken thing rather
 // than the first four healthy ones. `components` is only a preference for the
 // rest of the slots: a renamed entry costs its position, never the whole row.
 const preferred=source.components||[];
 const pool=(data.components||[]).filter(c=>c.name&&!c.group);
 const rank=c=>c.status==='operational'?1:0;
 const preference=c=>{const i=preferred.indexOf(c.name);return i<0?preferred.length:i};
 const resolved=pool.slice().sort((a,b)=>rank(a)-rank(b)||preference(a)-preference(b)).slice(0,4);
 const alerts=[
  ...(data.incidents||[]).map(i=>({kind:i.impact==='critical'?'critical':'incident',vendor:source.name,name:i.name,state:i.status,url:i.shortlink})),
  ...(data.scheduled_maintenances||[]).map(m=>({kind:'maintenance',vendor:source.name,name:m.name,state:m.status,url:m.shortlink})),
 ];
 return{indicator:data.status?.indicator||'unknown',updatedAt:data.page?.updated_at||null,items:resolved.map(c=>({name:c.name,status:c.status})),alerts};
}
function renderAlerts(providers){
 const alerts=providers.flatMap(provider=>provider.alerts||[]);
 document.getElementById('alerts').innerHTML=alerts.map(alert=>{
  const label=alert.kind==='maintenance'?'Maintenance':'Incident';
  const link=alert.url?`<a class="alert-link" href="${escapeHtml(alert.url)}" target="_blank" rel="noreferrer">Details ↗</a>`:'';
  return `<article class="alert ${alert.kind}"><div class="alert-body"><div class="alert-meta">${escapeHtml(alert.vendor)} · ${label}${alert.state?` · ${escapeHtml(titleCase(alert.state))}`:''}</div><div class="alert-name">${escapeHtml(alert.name)}</div></div>${link}</article>`;
 }).join('');
}
function renderTiles(list){
 document.getElementById('tilesLabel').hidden=!list.length;
 document.getElementById('tiles').innerHTML=list.map(provider=>{
  const reason=provider.linkOnly?(provider.note||'No public feed'):'Feed unreachable';
  return `<a class="tile" href="${escapeHtml(provider.page)}" target="_blank" rel="noreferrer"><span class="card-icon">${escapeHtml(provider.icon)}</span><span class="tile-body"><span class="tile-name">${escapeHtml(provider.name)}</span><span class="tile-reason">${escapeHtml(reason)}</span></span><span class="tile-cta">↗</span></a>`;
 }).join('');
}
function setBrowserStatus(tone,summary){
 const color={ok:'%233ddc84',warn:'%23ffb020',bad:'%23ff5c5c'}[tone];
 document.getElementById('favicon').href=`data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Ccircle cx='16' cy='16' r='11' fill='${color}'/%3E%3C/svg%3E`;
 document.title=`${{ok:'●',warn:'◐',bad:'⚠'}[tone]} ${summary} — Status Zero`;
}
function renderCards(providers){
 document.getElementById('cards').innerHTML=providers.map(provider=>{
  const type=stateClass(provider.indicator);
  const items=provider.items.length?provider.items.map(item=>`<div class="component"><span class="component-name">${escapeHtml(item.name)}</span><span class="component-state ${escapeHtml(item.status)}"><i></i>${escapeHtml(pretty(item.status))}</span></div>`).join(''):'<div class="component"><span class="component-name">No components reported</span><span class="component-state unavailable"><i></i>—</span></div>';
  return `<article class="card ${type}"><header class="card-head"><div class="card-title"><span class="card-icon">${escapeHtml(provider.icon)}</span><div class="card-heading"><div class="card-eyebrow">${escapeHtml(provider.vendor)}</div><h2>${escapeHtml(provider.name)}</h2></div></div><span class="badge"><i></i>${stateLabel(provider.indicator)}</span></header><div class="components">${items}</div><footer class="card-foot"><span>Updated ${provider.updatedAt?formatTime(new Date(provider.updatedAt)):'unknown'}</span><a href="${escapeHtml(provider.page)}" target="_blank" rel="noreferrer">Status page ↗</a></footer></article>`;
 }).join('');
}
async function check(){
 const button=document.getElementById('refresh'),icon=document.getElementById('refreshIcon'),label=document.getElementById('refreshText');
 button.disabled=true;icon.className='spin';label.textContent='Checking…';
 const providers=await Promise.all(SOURCES.map(async source=>{
  if(source.linkOnly)return{...source,indicator:'linkonly',updatedAt:null,items:[],alerts:[]};
  try{const response=await fetch(source.url,{cache:'no-store'});if(!response.ok)throw new Error('HTTP '+response.status);const data=await response.json();return{...source,...parseStatuspage(source,data)}}catch{return{...source,indicator:'unknown',updatedAt:null,items:[],alerts:[]}}
 }));
 // Only providers we actually read get a card or a vote in the verdict; a feed we
 // could not reach says nothing about that provider's health.
 const readable=providers.filter(provider=>provider.indicator!=='unknown'&&provider.indicator!=='linkonly');
 const tiles=providers.filter(provider=>provider.indicator==='unknown'||provider.indicator==='linkonly');
 const unreachable=tiles.filter(provider=>provider.indicator==='unknown').length;
 const linkOnly=tiles.length-unreachable;
 const classes=readable.map(provider=>stateClass(provider.indicator));
 const overallEl=document.getElementById('overall'),iconEl=document.getElementById('overallIcon');
 let tone,summary;
 if(!readable.length){tone='warn';summary='Unable to check';iconEl.textContent='○';}
 else if(classes.includes('danger')){tone='bad';summary='Attention needed';iconEl.textContent='⚠';}
 else if(classes.includes('warning')){tone='warn';summary='Degraded performance';iconEl.textContent='◐';}
 else{tone='ok';summary='All systems operational';iconEl.textContent='●';}
 document.getElementById('overallNote').textContent=[`${readable.length} services checked`,unreachable?`${unreachable} unreachable`:'',linkOnly?`${linkOnly} link-only`:''].filter(Boolean).join(' · ');
 overallEl.textContent=summary;overallEl.className='banner-value '+tone;iconEl.className='banner-icon '+tone;
 setBrowserStatus(tone,summary);
 document.getElementById('lastCheck').textContent=formatTime(new Date());
 seconds=60;
 renderAlerts(readable);
 renderCards(readable);
 renderTiles(tiles);
 button.disabled=false;icon.className='';label.textContent='Refresh';
}
function tick(){seconds=seconds<=1?60:seconds-1;document.getElementById('nextCheck').textContent=`${seconds}s`}
document.getElementById('refresh').addEventListener('click',check);
setInterval(tick,1000);setInterval(check,60000);tick();check();
</script>
</body>
</html>
